{{ define "main" }}
<article>
  <div class="article-header">
    <h1 class="article-title">{{ .Title | markdownify }}</h1>
    <div class="article-meta">
      {{ partial "post-date" . }}
      {{ with .Params.tags }} · {{ range $i, $t := . }}{{ if $i }}, {{ end }}{{ $t }}{{ end }}{{ end }}
    </div>
  </div>
  <div class="article-body">{{ .Content }}</div>
</article>
{{ end }}
