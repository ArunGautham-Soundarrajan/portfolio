<header class="site-header">
  <div class="wrap">
    <a class="site-logo" href="{{ "/" | relLangURL }}">{{ .Site.Params.logo.logoText | default .Site.Title }}</a>
    <nav class="site-nav">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}{{ if .Params.newtab }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
