{{ if gt .TotalPages 1 }}
<div class="pagination">
  <div class="pagination__buttons">
    {{ if .HasPrev }}<a href="{{ .Prev.URL }}" class="button inline">&larr; Newer</a>{{ end }}
    {{ if and .HasPrev .HasNext }}::{{ end }}
    {{ if .HasNext }}<a href="{{ .Next.URL }}" class="button inline">Older &rarr;</a>{{ end }}
  </div>
</div>
{{ end }}
