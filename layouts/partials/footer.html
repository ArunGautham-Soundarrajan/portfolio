<footer class="site-footer">
  <div class="wrap">
    <div class="footer-links">
      {{ with .Site.Params.social.github }}<a href="{{ . }}" target="_blank" rel="noopener">GitHub</a>{{ end }}
      {{ with .Site.Params.social.linkedin }}<a href="{{ . }}" target="_blank" rel="noopener">LinkedIn</a>{{ end }}
      {{ with .Site.Params.social.medium }}<a href="{{ . }}" target="_blank" rel="noopener">Medium</a>{{ end }}
      {{ with .Site.Params.author.email }}<a href="mailto:{{ . }}">Email</a>{{ end }}
    </div>
    <div class="copyright">&copy; {{ now.Year }} {{ .Site.Params.author.name | default .Site.Title }}</div>
  </div>
</footer>
