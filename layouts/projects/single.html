{{ define "main" }}
<article>
  <div class="article-header">
    <h1 class="article-title">{{ .Title | markdownify }}</h1>
    {{ with .Params.project_tags }}
      <div class="tag-list" style="margin-top:0.6rem;">{{ range . }}<span class="tag">{{ . }}</span>{{ end }}</div>
    {{ end }}
  </div>
  <div class="article-body">{{ .Content }}</div>
</article>
{{ end }}
