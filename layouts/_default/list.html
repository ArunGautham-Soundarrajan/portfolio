{{ define "main" }}
<article>
  <div class="article-header"><h1 class="article-title">{{ .Title }}</h1></div>
  <div class="article-body">{{ .Content }}</div>
</article>
{{ if .RegularPages }}
<div class="post-list" style="margin-top:2rem;">
  {{ range .RegularPages.ByDate.Reverse }}
    <article class="post-list-item">
      <div class="post-list-date"><time>{{ partial "post-date" . }}</time></div>
      <div class="post-list-main">
        <h2><a href="{{ .Permalink }}">{{ .Title | markdownify }}</a></h2>
        {{ with .Description }}<p>{{ . }}</p>{{ end }}
      </div>
    </article>
  {{ end }}
</div>
{{ end }}
{{ end }}
